name: Build SoloDesk for Windows
on:
  workflow_dispatch:
  push:
    tags: ["V*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup" }
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --name SoloDesk solodesk.py
      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$iscc) {
            $roots = @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "$env:ChocolateyInstall\lib")
            $iscc = Get-ChildItem -Path $roots -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$iscc) {
            choco list --limit-output
            throw "Inno Setup compiler ISCC.exe was not found after installation"
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path dist/SoloDesk/* -DestinationPath installer/SoloDesk-Portable-V1.1.zip -Force
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SoloDesk ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            installer/SoloDesk-Setup-V1.1.exe
            installer/SoloDesk-Portable-V1.1.zip
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SoloDesk-Setup-V1.1
          path: installer/SoloDesk-Setup-V1.1.exe
          if-no-files-found: error
      - name: Upload portable app folder
        uses: actions/upload-artifact@v4
        with:
          name: SoloDesk-Portable-V1.1
          path: dist/SoloDesk/

name: Build SoloDesk for Windows
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["V*"]
permissions:
  contents: write
concurrency:
  group: solodesk-v1-7-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow
      - name: Generate app icon and validate source
        run: |
          python tools/generate_icon.py
          python -m py_compile solodesk.py tools/generate_icon.py
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --name SoloDesk --icon assets/solodesk.ico --add-data "assets/solodesk.ico;." --add-data "assets/solodesk.png;." --collect-all customtkinter solodesk.py
      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup" }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$iscc) {
            $roots = @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "$env:ChocolateyInstall\lib")
            $iscc = Get-ChildItem -Path $roots -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$iscc) { throw "Inno Setup compiler ISCC.exe was not found" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path dist/SoloDesk/* -DestinationPath installer/SoloDesk-Portable-V1.8.zip -Force
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.8
          target_commitish: main
          name: SoloDesk V1.8
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer/SoloDesk-Setup-V1.8.exe
            installer/SoloDesk-Portable-V1.8.zip
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SoloDesk-Setup-V1.8
          path: installer/SoloDesk-Setup-V1.8.exe
          if-no-files-found: error
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: SoloDesk-Portable-V1.8
          path: dist/SoloDesk/
          if-no-files-found: error

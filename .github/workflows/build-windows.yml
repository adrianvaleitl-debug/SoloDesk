name: Build SoloDesk for Windows
on:
  workflow_dispatch:
  push:
    tags: ["V*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pyinstaller
          choco install innosetup --yes --no-progress
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --name SoloDesk solodesk.py
      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SoloDesk-Setup-V1.0
          path: installer/SoloDesk-Setup-V1.0.exe
          if-no-files-found: error
      - name: Upload portable app folder
        uses: actions/upload-artifact@v4
        with:
          name: SoloDesk-Portable-V1.0
          path: dist/SoloDesk/
